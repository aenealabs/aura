name: Code Quality Checks

on:
  pull_request:
    branches:
      - main
      - develop
    # Only run on code changes - skip for docs/config-only changes.
    #
    # `deploy/cloudformation/**` and `frontend/**` are included because
    # "Python Quality & Tests" is a REQUIRED status check in the
    # main-protection ruleset. A required check that never runs is reported as
    # missing, not as passing, so a PR touching only those trees would be
    # blocked indefinitely with every check it did run showing green. Listing
    # the paths here means the required context always reports. The job body
    # skips the Python-only work when no Python changed, so this does not run
    # the full suite for a template or component edit.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/cloudformation/**'
      - 'frontend/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
      - '.github/workflows/code-quality.yml'
  # Push to main only runs smoke tests (fast validation after merge)
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/cloudformation/**'
      - 'frontend/**'
  workflow_dispatch:

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Quality checks are read-only by default. Jobs that need write access
  # (e.g. release-please, auto-fix, upload-sarif) declare it at the job
  # scope, not workflow-scope.
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # Single consolidated job for push to main (lint only - fast validation)
  # PRs run the full suite in python-quality job
  check-trigger:
    name: Check Trigger Type
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run_full_tests: ${{ steps.check.outputs.run_full_tests }}
    steps:
      - name: Determine test level
        id: check
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "run_full_tests=true" >> $GITHUB_OUTPUT
          else
            echo "run_full_tests=false" >> $GITHUB_OUTPUT
          fi

  # CONSOLIDATED: Lint + Tests in single job (saves 3 runner spin-ups)
  python-quality:
    name: Python Quality & Tests
    runs-on: ubuntu-24.04
    needs: check-trigger
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # fetch-depth: 0 retrieves full history so the diff-scoped
        # pre-commit step below can resolve `${{ github.event.before }}`
        # / PR base SHAs. The default depth=1 makes HEAD~1 unreachable
        # and breaks `pre-commit run --from-ref`.
        with:
          fetch-depth: 0

      # Resolve which areas changed so a template-only PR does not pay for the
      # full Python toolchain (torch et al) and the full test suite, and a
      # Python-only PR does not pay for cfn-lint. Uses the same diff-window
      # resolution as the pre-commit step below. On any ambiguity it fails
      # SAFE -- both areas true, i.e. run everything.
      - name: Detect changed areas
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000

          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            FROM="$PR_BASE"; TO="$PR_HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ]; then
            FROM="$PUSH_BEFORE"; TO="${PUSH_AFTER:-HEAD}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            FROM="$(git rev-parse HEAD^)"; TO="HEAD"
          else
            echo "Cannot resolve a diff window - running everything."
            echo "python_changed=true" >> "$GITHUB_OUTPUT"
            echo "cfn_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$FROM" "$TO")"
          echo "Changed files in $FROM..$TO:"
          echo "$CHANGED"

          PY=false
          CFN=false
          if echo "$CHANGED" | grep -qE '^(src/|tests/|requirements.*\.txt$|pyproject\.toml$|setup\.(py|cfg)$|\.github/workflows/code-quality\.yml$)'; then
            PY=true
          fi
          if echo "$CHANGED" | grep -qE '^deploy/cloudformation/.*\.(yaml|yml)$'; then
            CFN=true
          fi

          echo "python_changed=$PY" >> "$GITHUB_OUTPUT"
          echo "cfn_changed=$CFN" >> "$GITHUB_OUTPUT"
          echo "python_changed=$PY  cfn_changed=$CFN"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # --- CLOUDFORMATION VALIDATION ---
      # Previously no workflow triggered on deploy/cloudformation/** at all,
      # so 176+ templates reached CI only via the 02:00 nightly job -- after
      # merge. This is the pull-request gate for them. The wrapper implements
      # the documented exit-code contract (4 -> pass, 2/6/8 -> fail).
      - name: Install cfn-lint
        if: steps.changes.outputs.cfn_changed == 'true'
        run: pip install cfn-lint

      - name: Validate changed CloudFormation templates
        if: steps.changes.outputs.cfn_changed == 'true'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000

          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            FROM="$PR_BASE"; TO="$PR_HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ]; then
            FROM="$PUSH_BEFORE"; TO="${PUSH_AFTER:-HEAD}"
          else
            FROM="$(git rev-parse HEAD^)"; TO="HEAD"
          fi

          # Only templates that still exist (a deleted template must not fail
          # the run), and never the archive/ tree.
          TEMPLATES="$(git diff --name-only --diff-filter=d "$FROM" "$TO" \
            | grep -E '^deploy/cloudformation/.*\.(yaml|yml)$' \
            | grep -v '/archive/' || true)"

          if [ -z "$TEMPLATES" ]; then
            echo "No CloudFormation templates to validate."
            exit 0
          fi

          echo "Validating:"
          echo "$TEMPLATES"

          chmod +x scripts/cfn-lint-wrapper.sh
          FAILED=0
          for t in $TEMPLATES; do
            echo "--- $t"
            if ! ./scripts/cfn-lint-wrapper.sh "$t"; then
              echo "::error file=$t::cfn-lint reported errors"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Install dependencies
        if: steps.changes.outputs.python_changed == 'true'
        run: |
          pip install --upgrade pip
          pip install black==26.3.1 flake8 mypy bandit[toml]
          # Native deps (torch + everything via requirements.txt -- numpy,
          # sklearn, hdbscan) install with --no-cache-dir to force a fresh
          # wheel fetch every run. The pip cache otherwise hangs onto wheels
          # compiled against a stale numpy ABI (issue #221 / PR #172): when
          # numpy is bumped across the 1.x->2.x ABI boundary, cached native
          # wheels built against numpy 1.x crash with SIGSEGV when handed
          # numpy 2.x arrays by other native deps. Bypassing the cache here
          # is the prerequisite for unpinning numpy.
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          # requirements.txt install must fail loudly. Previously this line
          # ended in `|| true`, which silently masked transient PyPI errors
          # and unavailable wheels and left required packages uninstalled --
          # subsequent pytest steps then failed with ModuleNotFoundError,
          # creating opaque "green-by-flake" CI behaviour. See issue #190.
          pip install --no-cache-dir -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-forked pytest-xdist
          pip install 'pydantic[email]'  # Required for email validation in tests

      # --- LINTING (always runs) ---
      # Two layers:
      #   1. Direct black/flake8 below — fast bare-config sanity gate.
      #   2. pre-commit run scoped to the diff — same hooks devs run
      #      locally (.pre-commit-config.yaml). Scoped to changed files
      #      so pre-existing repo-wide violations don't block PRs while
      #      we adopt the gate; new issues from this push/PR still fail.
      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on changed files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          # ``no-commit-to-branch`` is a LOCAL guard that prevents
          # developers from accidentally committing directly to main.
          # By the time CI runs, the commit already exists on main —
          # so the hook trivially fails on every push. Skip it in CI;
          # local enforcement is unchanged.
          SKIP: no-commit-to-branch
        run: |
          # Resolve the diff window. Three cases:
          #   1. PR event: scope to PR base..head.
          #   2. Push event: scope to before..after (the SHAs GitHub
          #      reports for the push). For brand-new branch pushes
          #      `before` is all-zeros — fall through to (3).
          #   3. Fallback: scope to HEAD's parent (HEAD^) only if it
          #      resolves; otherwise lint the entire diff against the
          #      empty tree (i.e. "everything in HEAD"). Never pass
          #      HEAD~1 unguarded — shallow clones don't resolve it.
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000

          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            FROM="$PR_BASE"
            TO="$PR_HEAD"
            echo "Pre-commit scope: PR diff $FROM..$TO"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ]; then
            FROM="$PUSH_BEFORE"
            TO="${PUSH_AFTER:-HEAD}"
            echo "Pre-commit scope: push diff $FROM..$TO"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            FROM="$(git rev-parse HEAD^)"
            TO="HEAD"
            echo "Pre-commit scope: HEAD^..HEAD ($FROM..$TO)"
          else
            echo "Pre-commit scope: initial commit — running --all-files"
            pre-commit run --all-files --show-diff-on-failure
            exit $?
          fi

          pre-commit run --from-ref "$FROM" --to-ref "$TO" --show-diff-on-failure

      - name: Run Black (formatting check)
        id: black-check
        if: steps.changes.outputs.python_changed == 'true'
        run: |
          if ! black --check --fast src/ tests/ 2>&1; then
            echo "needs_format=true" >> $GITHUB_OUTPUT
          else
            echo "needs_format=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail on Black formatting drift
        if: steps.black-check.outputs.needs_format == 'true'
        run: |
          # main is a protected branch (PRs required), so we cannot
          # auto-push fixups. Fail the job and surface the diff so the
          # author can run `black --fast src/ tests/` locally and amend
          # / open a follow-up PR.
          echo "::error::Black formatting drift detected on ${{ github.ref }}."
          echo "::error::Run 'black --fast src/ tests/' locally and commit."
          black --check --fast --diff src/ tests/ || true
          exit 1

      - name: Run Flake8 (linting)
        if: steps.changes.outputs.python_changed == 'true'
        run: flake8 src/ tests/

      - name: Run MyPy (type checking)
        if: steps.changes.outputs.python_changed == 'true'
        continue-on-error: true
        run: mypy src/ --ignore-missing-imports

      - name: Run Bandit (security lint)
        if: steps.changes.outputs.python_changed == 'true'
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll -ii  # Only MEDIUM+ severity

      # --- TESTS (PRs only) ---
      - name: Run tests with coverage
        if: needs.check-trigger.outputs.run_full_tests == 'true' && steps.changes.outputs.python_changed == 'true'
        run: |
          # pytest-cov handles coverage collection automatically
          # Do NOT set COVERAGE_PROCESS_START - it conflicts with pytest-cov
          pytest tests/ --lf --ff \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --maxfail=10 \
            -v || PYTEST_EXIT=$?

          # Show coverage summary
          echo ""
          echo "=== Coverage Summary ==="
          if [ -f .coverage ]; then
            coverage report --show-missing || echo "Coverage report failed"
          elif ls .coverage.* 1>/dev/null 2>&1; then
            echo "Combining parallel coverage files..."
            coverage combine
            coverage report --show-missing || echo "Coverage report failed"
          else
            echo "WARNING: No coverage data found"
          fi

          # Exit with original pytest status
          exit ${PYTEST_EXIT:-0}

      # --- SEMANTIC GUARDRAILS E2E (Optional: Real AWS Mode) ---
      # By default, guardrails E2E tests use moto mocking (no AWS credentials needed).
      # To enable real AWS E2E testing against deployed infrastructure:
      #
      # 1. Uncomment the step below
      # 2. Configure AWS credentials via OIDC or secrets
      # 3. Ensure the IAM role has permissions for:
      #    - cloudwatch:PutMetricData (Aura/SemanticGuardrails namespace)
      #    - cloudwatch:GetMetricStatistics
      #    - sns:Publish, sns:CreateTopic, sns:ListTopics
      #    - dynamodb:PutItem, dynamodb:GetItem (guardrails audit table)
      #
      # - name: Run Semantic Guardrails E2E (Real AWS)
      #   if: needs.check-trigger.outputs.run_full_tests == 'true'
      #   env:
      #     RUN_AWS_E2E_TESTS: "1"
      #     AWS_REGION: us-east-1
      #     ENVIRONMENT: dev
      #   run: |
      #     echo "Running Semantic Guardrails E2E tests against real AWS..."
      #     pytest tests/test_semantic_guardrails_e2e.py -v --no-cov --tb=short
      #     echo "Semantic Guardrails E2E tests completed"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-reports
          path: |
            bandit-report.json
            htmlcov/
            coverage.xml

  # Security scan runs in parallel (PRs only)
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-24.04
    needs: check-trigger
    timeout-minutes: 10
    if: needs.check-trigger.outputs.run_full_tests == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Trivy vulnerability scanner
        # SHA verified against the v0.36.0 release tag via the GitHub
        # API (the released tag object resolves to this commit SHA).
        # The May 10, 2026 GTM audit flagged the previous "# master"
        # comment as ambiguous - the SHA does NOT track master; it is
        # immutable, even if the upstream tag is later moved.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        if: always()
        continue-on-error: true  # GitHub Advanced Security may not be enabled
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================================================
  # Frontend quality gate
  # ==========================================================================
  # Before this job, nothing in CI touched `frontend/`. `code-quality.yml` was
  # path-filtered to Python and CloudFormation, and `buildspec-validation.yml`
  # covers only buildspecs -- so 1,880 tests across 80 files ran on developer
  # machines and nowhere else, and a frontend regression merged green.
  #
  # This is a separate job rather than steps inside `python-quality` because
  # the two need different toolchains and should fail independently: a broken
  # component should not read as a Python failure.
  frontend-quality:
    name: Frontend Quality & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Self-contained detection rather than reading an output from
      # `python-quality`, so this job does not need to wait on it.
      - name: Detect frontend changes
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000

          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            FROM="$PR_BASE"; TO="$PR_HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ]; then
            FROM="$PUSH_BEFORE"; TO="${PUSH_AFTER:-HEAD}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            FROM="$(git rev-parse HEAD^)"; TO="HEAD"
          else
            echo "Cannot resolve a diff window - running the frontend gate."
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The workflow file counts as a frontend change so that any edit to
          # this gate exercises it. Without that, a PR touching only the
          # workflow skips every meaningful step and reports a green
          # "Frontend Quality & Tests" in about five seconds -- a passing
          # check that installed nothing, linted nothing and built nothing.
          # A broken gate would then surface on the next contributor's
          # frontend PR and look like their failure. The Python detection
          # above already treats this file the same way.
          if git diff --name-only "$FROM" "$TO" \
              | grep -qE '^(frontend/|\.github/workflows/code-quality\.yml$)'; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changes.outputs.frontend_changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `--legacy-peer-deps` is mandatory here, not a shortcut:
      # eslint-plugin-react@7.37.5 caps its peer-eslint range at ^9.7 while the
      # project is on eslint@10.x, so npm refuses to resolve without it. The
      # rationale and the replacement plan are in `frontend/CLAUDE.md`.
      - name: Install dependencies
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Tests
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm run test:run

      # A component can lint and test clean and still break the bundle --
      # an unresolved import only surfaces at build time.
      - name: Build
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm run build
